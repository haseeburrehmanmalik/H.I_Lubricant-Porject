<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>H.I Lubricant</title>
    <script type="text/javascript">
      // GitHub Pages HashRouter Redirector
      var repo = '/H.I_Lubricant-Porject';
      var path = window.location.pathname;
      if (path.indexOf(repo) === 0) {
        path = path.slice(repo.length);
      }
      if (!path || path === '/') {
        path = '';
      }
      var target = repo + '/#' + path + window.location.search + window.location.hash;
      window.location.replace(target);
    </script>
  </head>
  <body style="background-color: #090909; color: #D7AD55; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Loading H.I Lubricant...</p>
  </body>
</html>
